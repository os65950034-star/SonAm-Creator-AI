name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade Pip
        run: python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller ^
          --onefile ^
          --clean ^
          --collect-all edge_tts ^
          --collect-all moviepy ^
          --collect-all imageio ^
          --collect-all imageio_ffmpeg ^
          --collect-all proglog ^
          --collect-all PIL ^
          --name SonAmCreatorAI ^
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SonAmCreatorAI-Windows
          path: dist/SonAmCreatorAI.exe
